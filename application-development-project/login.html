<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PHT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="login_style.css" rel="stylesheet" />
</head>
<body>
    <!-- Navigation -->
    <div class="navigation">
        <div class="site-name">PHT - Site Name</div>
        
        <div class="nav-items">
            <div class="nav-page">Home</div>
            <div class="nav-page">About</div>
            <div class="nav-page">Menu</div>
            <button class="nav-button">
                <span class="nav-button-text">Login</span>
            </button>
        </div>

        <button class="nav-button signup-button">
            <span class="nav-button-text">Sign Up</span>
        </button>
    </div>

    <!-- Login Form -->
    <div class="blur-bg-left"></div>
    <div class="blur-bg-right"></div>

    <div class="welcome-text">Welcome Back to PHT</div>

    <div class="username-label">Username:</div>
    <span class="material-icons username-icon">account_circle</span>
    <input type="text" class="username-input" placeholder="">

    <div class="password-label">Password:</div>
    <span class="material-icons password-icon">lock</span>
    <input type="password" class="password-input" placeholder="">

    <div class="forgot-password">Forgot password?</div>

    <button class="login-button"></button>
    <div class="login-button-text">Login Now</div>

    <div class="register-text">Haven't an account? <span>Register now</span></div>

    <div class="image-placeholder">Put Image at here</div>
</body>
</html>
